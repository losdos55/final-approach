<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Final Approach</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1a2b"/>
      <stop offset="0.55" stop-color="#071019"/>
      <stop offset="1" stop-color="#03060a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.86" r="0.55">
      <stop offset="0" stop-color="#2ee6d6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2ee6d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ee6d6" stop-opacity="0"/>
      <stop offset="1" stop-color="#2ee6d6" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- runway in perspective -->
  <path d="M226 352 L286 352 L352 512 L160 512 Z" fill="#0f1c26"/>
  <path d="M256 362 V378 M256 392 V412 M256 428 V454 M256 472 V506" stroke="#e9f6ff" stroke-opacity="0.8" stroke-width="5" stroke-linecap="round"/>
  <path d="M226 352 L160 512 M286 352 L352 512" stroke="#e9f6ff" stroke-opacity="0.35" stroke-width="3"/>
  <!-- approach light bar -->
  <g fill="#ffd27a">
    <circle cx="214" cy="342" r="4.5"/><circle cx="228" cy="342" r="4.5"/><circle cx="242" cy="342" r="4.5"/>
    <circle cx="270" cy="342" r="4.5"/><circle cx="284" cy="342" r="4.5"/><circle cx="298" cy="342" r="4.5"/>
  </g>
  <g fill="#ffffff">
    <circle cx="256" cy="330" r="4"/><circle cx="256" cy="318" r="3.6"/><circle cx="256" cy="307" r="3.2"/><circle cx="256" cy="297" r="2.8"/>
  </g>
  <g fill="#ff7a45">
    <circle cx="200" cy="352" r="4"/><circle cx="312" cy="352" r="4"/>
  </g>
  <!-- glide path -->
  <path d="M256 236 L256 296" stroke="url(#path)" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>
  <!-- aircraft, head-on on final: fuselage, wings with slight dihedral, engines, tail -->
  <g fill="#eef6ff">
    <ellipse cx="256" cy="196" rx="22" ry="24"/>
    <path d="M90 214 Q172 196 236 192 L276 192 Q340 196 422 214 L422 222 Q340 214 276 212 L236 212 Q172 214 90 222 Z"/>
    <path d="M250 174 L256 112 L262 174 Z"/>
    <path d="M206 174 Q256 168 306 174 L306 180 Q256 176 206 180 Z"/>
  </g>
  <g fill="#c9d6e3">
    <rect x="174" y="210" width="26" height="22" rx="11"/>
    <rect x="312" y="210" width="26" height="22" rx="11"/>
  </g>
  <g fill="#2ee6d6">
    <circle cx="94" cy="218" r="5"/>
  </g>
  <g fill="#ff4d5e">
    <circle cx="418" cy="218" r="5"/>
  </g>
  <circle cx="256" cy="226" r="5" fill="#ffffff"/>
</svg>
